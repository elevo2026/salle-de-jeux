<style>

*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#ffe7c8,#f8efe3 35%,#f4dfc4);color:var(--fg);font-family:Inter,Segoe UI,sans-serif;-webkit-user-select:none;user-select:none} body{padding:12px} main{max-width:420px;margin:0 auto;padding:10px 0 28px;display:flex;flex-direction:column;align-items:center;gap:12px} header{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%} header a{color:var(--fg);text-decoration:none;background:rgba(255,255,255,.35);padding:8px 12px;border-radius:999px;border:1px solid var(--line)} header .tag{padding:8px 12px;border-radius:999px;background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.2);font-size:.8rem;color:var(--accent)} h1{margin:0;font-size:1.7rem;text-align:center} .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center} .tabs button{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--fg);font-weight:700;border:0} .tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#2c1a0e} #area{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px} .info{font-weight:700;text-align:center;min-height:1.6em;font-size:1.08rem;color:var(--soft)} button{font:inherit;font-weight:800;border:0;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btnfg);padding:12px 22px;font-size:1.08rem;cursor:pointer} button:focus-visible{outline:3px solid var(--fg);outline-offset:2px} .cv{display:block;border-radius:18px;background:rgba(255,255,255,.35);touch-action:none;border:1px solid var(--line)} .grid{display:grid;gap:8px;width:min(100%,330px)} .g3{grid-template-columns:repeat(3,1fr)} .card{aspect-ratio:1;font-size:2.4rem;padding:0;background:#fde7c9;color:#502f1a;border-radius:16px;border:1px solid rgba(96,56,27,.08)} .card.up{background:#fff8ee}.card:disabled{opacity:.6;cursor:default}.ttt .card{font-size:3rem}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sm{font-size:1rem;padding:10px 16px}.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}.pad button{padding:0;font-size:1.6rem;border-radius:18px;background:#fff7ed;color:var(--fg)}.bar{display:flex;gap:10px;justify-content:center}.bar div{background:rgba(255,255,255,.45);border:1px solid var(--line);border-radius:14px;padding:6px 16px;font-weight:700;font-size:1.05rem}.over{position:absolute;inset:0;border-radius:18px;background:rgba(53,33,19,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}.over[hidden]{display:none}.over p{margin:0;font-size:1.15rem;font-weight:700}.sg{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,360px);border:3px solid var(--fg);border-radius:6px;overflow:hidden}.sg button{aspect-ratio:1;padding:0;font-size:1.25rem;border-radius:0;background:#fff8ee;border:1px solid rgba(96,56,27,.12);color:#581c0c}.sg .fx{background:#f7d5a8;color:#581c0c}.sg .tk{border-left:3px solid var(--fg)}.sg .tt{border-top:3px solid var(--fg)}.sg .sl{background:#fef08a;color:#3b2c15}.sg .bd{color:#d62828}.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,360px)}.np button{padding:10px 0;font-size:1.3rem;border-radius:12px;background:#fff7ed;color:var(--fg)}.p4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:min(100%,360px);background:#ef8c3a;padding:6px;border-radius:14px}.pc{aspect-ratio:1;padding:0;font-size:1.6rem;border-radius:50%;background:#fff7ed;color:var(--fg)}.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
</style>

<script>
(function(){function E(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}var area=document.getElementById('area'),tabs=document.getElementById('tabs'),cur=null,games={},btns={};var F=['🍕','🍔','🍟','🍦','🍰','🍎'];function show(k){if(cur&&games[cur].stop)games[cur].stop();cur=k;area.innerHTML='';Object.keys(btns).forEach(function(n){btns[n].className=n===k?'on':''});games[k].init(area);}games.mem={init:function(a){var deck,open,lock,moves,found,cards=[];var info=E('div','info'),grid=E('div','grid g3'),btn=E('button','','Rejouer');a.append(info,grid,btn);function upd(){info.textContent=found===6?'Bravo ! Tu as gagné en '+moves+' coups 🎉':'Trouve les paires ! Coups : '+moves}function newG(){deck=F.concat(F).sort(function(){return Math.random()-.5});open=[];lock=false;moves=0;found=0;grid.innerHTML='';cards=deck.map(function(e,i){var b=E('button','card','❓');b.onclick=function(){flip(i)};grid.appendChild(b);return b});upd()}function flip(i){if(lock||open.indexOf(i)>-1||cards[i].disabled)return;cards[i].textContent=deck[i];cards[i].classList.add('up');open.push(i);if(open.length===2){moves++;var p=open[0],q=open[1];if(deck[p]===deck[q]){cards[p].disabled=cards[q].disabled=true;found++;open=[];upd()}else{lock=true;setTimeout(function(){[p,q].forEach(function(k){cards[k].textContent='❓';cards[k].classList.remove('up')});open=[];lock=false;upd()},800)}}}btn.onclick=newG;newG();}};games.snk={init:function(a){var N=14,W=Math.floor(Math.min(window.innerWidth-24,390)/N)*N,c=W/N,q=cvs(W,W),cv=q[0],x=q[1],info=E('div','bar'),btn=E('button','','Jouer'),sE=E('span','','0'),bE=E('span','','0'),ms=E('p','','Mange tous les plats pour grandir !'),ov=E('div','over'),wr=E('div','wrap'),dk=false,S=[{x:5,y:7},{x:4,y:7},{x:3,y:7}],dir='r',nd='r',fd={x:9,y:7,e:'🍕'},sc=0,best=0,tm,run=false;try{best=parseInt(localStorage.getItem('serpent-best'),10)||0}catch(e){}var c1=E('div'),c2=E('div');c1.append('Score : ',sE);c2.append('Record : ',bE);info.append(c1,c2);ov.append(ms,btn);wr.append(cv,ov);a.append(info,wr);function turn(d){if(d!=={u:'d',d:'u',l:'r',r:'l'}[dir])nd=d}pad(a,turn);swipe(cv,turn);var off=keys(turn);function upd(){sE.textContent=sc;bE.textContent=best}function put(){do{fd={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),e:F[Math.floor(Math.random()*F.length)]}}while(S.some(function(p){return p.x===fd.x&&p.y===fd.y}))}function go(){S=[{x:5,y:7},{x:4,y:7},{x:3,y:7}];dir=nd='r';sc=0;put();run=true;ov.hidden=true;upd();draw();tm=setTimeout(tick,340)}function tick(){if(!run)return;dir=nd;var v=V[dir],h=S[0],n={x:(h.x+v[0]+N)%N,y:(h.y+v[1]+N)%N};if(S.some(function(p){return p.x===n.x&&p.y===n.y})){run=false;if(sc>best){best=sc;try{localStorage.setItem('serpent-best',String(best))}catch(e){}}upd();ms.textContent=sc>0?'Miam ! Tu as mangé '+sc+' plat'+(sc>1?'s':'')+'.':'Oups ! Réessaie.';btn.textContent='Rejouer';ov.hidden=false;return}S.unshift(n);if(n.x===fd.x&&n.y===fd.y){sc++;upd();put()}else S.pop();draw();tm=setTimeout(tick,Math.max(180,340-sc*6))}function draw(){x.clearRect(0,0,W,W);x.fillStyle='#f9e8d0';for(var i=0;i<N;i++)for(var j=0;j<N;j++)if((i+j)%2)x.fillRect(i*c,j*c,c,c);x.textAlign='center';x.textBaseline='middle';x.font=Math.floor(c*0.78)+'px serif';x.fillText(fd.e,fd.x*c+c/2,fd.y*c+c/2+1);S.forEach(function(p,i){var m=i?2:1;x.fillStyle=i?'#f59e0b':'#ef8c3a';x.beginPath();if(x.roundRect)x.roundRect(p.x*c+m,p.y*c+m,c-2*m,c-2*m,c*0.3);else x.rect(p.x*c+m,p.y*c+m,c-2*m,c-2*m);x.fill()});var h=S[0],ex=h.x*c,ey=h.y*c;x.fillStyle='#fff';x.beginPath();x.arc(ex+c*0.32,ey+c*0.38,c*0.11,0,7);x.arc(ex+c*0.68,ey+c*0.38,c*0.11,0,7);x.fill();x.fillStyle='#492710';x.beginPath();x.arc(ex+c*0.32,ey+c*0.38,c*0.05,0,7);x.arc(ex+c*0.68,ey+c*0.38,c*0.05,0,7);x.fill()}btn.onclick=go;games.snk.stop=function(){run=false;clearTimeout(tm);off()};upd();draw();}};
var V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};function pad(a,fn){var p=E('div','pad');[['u','▲'],['l','◀'],['d','▼'],['r','▶']].forEach(function(d){var b=E('button',d[0],d[1]);b.onclick=function(){fn(d[0])};p.appendChild(b)});a.appendChild(p)}function swipe(el,fn){var s;el.addEventListener('pointerdown',function(e){s=[e.clientX,e.clientY]});el.addEventListener('pointerup',function(e){if(!s)return;var dx=e.clientX-s[0],dy=e.clientY-s[1];s=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;fn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))})}function keys(fn){var h=function(e){var m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){e.preventDefault();fn(m)}};document.addEventListener('keydown',h);return function(){document.removeEventListener('keydown',h)}}function cvs(W,H){var d=window.devicePixelRatio||1,v=E('canvas','cv');v.width=W*d;v.height=H*d;v.style.width=W+'px';v.style.height=H+'px';var x=v.getContext('2d');x.scale(d,d);return [v,x]}[['snk','🐍 Snake'],['mem','🃏 Memory']].forEach(function(g){var b=E('button','',g[1]);b.onclick=function(){show(g[0])};tabs.appendChild(b);btns[g[0]]=b;});show('snk');})();
</script>
