<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle de jeux — Café</title>
<style>
:root{
  --bg:#f8efe3;
  --bg2:#f1dfc5;
  --panel:#fffaf4;
  --panel2:#f2e0c5;
  --fg:#3c2619;
  --soft:#7b4d2a;
  --line:rgba(90,50,29,.18);
  --accent:#c56d1b;
  --accent2:#ef9c4c;
  --btn:#d98b2d;
  --btnfg:#fffaf2;
  --gold:#f5d36a;
  --shadow:rgba(86,48,25,.18);
  --card:#fffdf9;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#f7e8d0 0%,#f6ebdd 35%,#eed7b7 100%);color:var(--fg);font-family:Segoe UI,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{padding:18px 12px 32px}
main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
header a{color:var(--soft);text-decoration:none;font-weight:700}
.tag{background:rgba(255,255,255,.35);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
h1{margin:0;font-size:2rem;text-align:center;color:var(--fg)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tabs button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--fg);font-weight:800;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.05);cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--btnfg);border-color:transparent;box-shadow:0 10px 20px rgba(201,129,41,.26)}
#area{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.info{font-weight:800;font-size:1.05rem;min-height:1.6em;text-align:center;color:var(--fg)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button.action{padding:10px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--btn),#c66914);color:var(--btnfg);font-weight:900;box-shadow:0 10px 20px rgba(151,81,21,.18)}
.grid{display:grid;gap:8px;width:min(100%,330px)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.card{aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(180deg,#f7ead5,#ebd9bc);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 10px 16px rgba(0,0,0,.06);overflow:hidden;padding:0;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:.2s ease}
.card.visible img,.card.matched img{opacity:1}
.card.empty{background:rgba(255,255,255,.35)}
.card.empty::before{content:"";position:absolute;inset:10%;border:2px dashed rgba(80,46,21,.2);border-radius:12px}
.card.visible, .card.matched{background:var(--panel)}
.card.matched{outline:3px solid rgba(255,214,102,.8);outline-offset:-2px}
.card .back{position:absolute;inset:0;background:linear-gradient(135deg,#f7d59c,#df9a5f);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff5de}
.card.visible .back,.card.matched .back{opacity:0}
.card img{opacity:0}
.card.visible img,.card.matched img{opacity:1}
.scene{position:relative;display:flex;align-items:center;justify-content:center;width:min(100%,360px);height:240px;border-radius:18px;background:linear-gradient(180deg,#f3e5cf,#ebd7b1);border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 2px 0 rgba(255,255,255,.36)}
.scene .drop{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:12px;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.68);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.scene .catcher{position:absolute;bottom:12px;transform:translateX(-50%);width:82px;height:26px;border-radius:14px;background:linear-gradient(180deg,#d08a35,#a85d1b);box-shadow:0 10px 20px rgba(141,75,20,.3)}
.scene .catcher::before{content:"";position:absolute;inset:4px 10px 8px;border-radius:10px;background:rgba(255,255,255,.18)}
.puzzle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,330px)}
.puzzle-piece{aspect-ratio:1;border:0;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 8px 14px rgba(0,0,0,.08);position:relative;overflow:hidden}
.puzzle-piece.empty{background:rgba(255,255,255,.25);border:2px dashed rgba(108,62,30,.25)}
.puzzle-piece.empty::before{content:"";position:absolute;inset:10%;border:2px dashed rgba(108,62,30,.35);border-radius:10px}
.ttt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px)}
.ttt-cell{aspect-ratio:1;border:0;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(0,0,0,.05)}
.ttt-cell img{width:72%;height:72%;object-fit:cover;border-radius:12px}
.snake-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:min(100%,320px);background:rgba(255,255,255,.3);padding:6px;border-radius:12px;border:1px solid var(--line)}
.snake-cell{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.snake-cell.snake{background:linear-gradient(135deg,#7b4d2a,#d98b2d);box-shadow:inset 0 2px 0 rgba(255,255,255,.22)}
.snake-cell.food{background:linear-gradient(135deg,#ffe5b3,#ffb36a);}
.snake-cell.food::before{content:"🍓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem}
@media (max-width:360px){
  .tabs{gap:6px}.tabs button{padding:8px 10px;font-size:.8rem}
  .scene{height:210px}
}
</style>
</head>
<body>
<main>
  <header>
    <a href="index.html">← Retour</a>
    <div class="tag">Version Café</div>
  </header>
  <h1>Salle de jeux</h1>
  <div class="tabs" id="tabs"></div>
  <div id="area"></div>
</main>
<script>
(function(){
  function E(tag, cls, text){
    var el = document.createElement(tag);
    if(cls) el.className = cls;
    if(text !== undefined && text !== null) el.textContent = text;
    return el;
  }
  var area = document.getElementById('area');
  var tabs = document.getElementById('tabs');
  var current = null;
  var games = {};

  const IMG = [
    'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1521017432531-fbd92d768814?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1556474835-b0f3ac40d4d1?auto=format&fit=crop&w=900&q=80',
    'https://images.unsplash.com/photo-1466978913421-dad2ebd01d17?auto=format&fit=crop&w=900&q=80'
  ];

  function createImage(src, alt){
    var img = new Image();
    img.src = src;
    img.alt = alt;
    img.loading = 'lazy';
    return img;
  }

  function show(name){
    if(current && games[current] && games[current].stop) games[current].stop();
    current = name;
    area.innerHTML = '';
    for (var k in games){
      var b = games[k].button;
      if(b) b.classList.toggle('on', k === name);
    }
    games[name].init(area);
  }

  games.memoire = {
    init: function(container){
      var moves = 0;
      var found = 0;
      var lock = false;
      var first = null;
      var second = null;
      var cards = [];
      var info = E('div','info');
      var grid = E('div','grid grid-3');
      var btn = E('button','action','Rejouer');
      container.appendChild(info);
      container.appendChild(grid);
      container.appendChild(btn);

      function shuffle(arr){
        for (var i = arr.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        return arr;
      }

      function updateInfo(){
        if(found === 8){
          info.textContent = 'Bravo ! Tu as gagné en ' + moves + ' coups ✨';
        } else {
          info.textContent = 'Trouve les paires ! Coups : ' + moves;
        }
      }

      function reset(){
        moves = 0; found = 0; lock = false; first = null; second = null;
        grid.innerHTML = '';
        var pairs = shuffle(IMG.slice(0,8).concat(IMG.slice(0,8)));
        cards = pairs.map(function(src, i){
          var c = E('button','card');
          var img = createImage(src, 'photo');
          var back = E('span','back','?');
          c.appendChild(img);
          c.appendChild(back);
          c.dataset.src = src;
          c.addEventListener('click', function(){
            if(lock || c.classList.contains('visible') || c.classList.contains('matched')) return;
            c.classList.add('visible');
            if(!first){ first = c; return; }
            second = c;
            moves += 1;
            if(first.dataset.src === second.dataset.src){
              first.classList.add('matched');
              second.classList.add('matched');
              first = null; second = null; found += 1; updateInfo();
              if(found === 8) return;
            } else {
              lock = true;
              setTimeout(function(){
                first.classList.remove('visible');
                second.classList.remove('visible');
                first = null; second = null; lock = false; updateInfo();
              }, 700);
            }
            updateInfo();
          });
          grid.appendChild(c);
          return c;
        });
        updateInfo();
      }

      btn.addEventListener('click', reset);
      reset();
    },
    stop: function(){}
  };

  games.attrape = {
    init: function(container){
      var info = E('div','info');
      var scene = E('div','scene');
      var btn = E('button','action','Jouer');
      container.appendChild(info);
      container.appendChild(scene);
      container.appendChild(btn);

      var state = {running:false, score:0, lives:3, drops:[], catcherX: scene.clientWidth/2 || 180, raf:0, lastTime:0};
      var catcher = E('div','catcher');
      scene.appendChild(catcher);

      function updateInfo(){
        info.textContent = 'Score : ' + state.score + '  ' + '❤'.repeat(state.lives);
      }

      function spawnDrop(){
        var src = IMG[Math.floor(Math.random()*IMG.length)];
        var d = E('div','drop');
        d.style.backgroundImage = 'url("' + src + '")';
        var x = 20 + Math.random() * (scene.clientWidth - 70);
        d.style.left = x + 'px';
        d.style.top = '-50px';
        d.dataset.speed = 1 + Math.random() * 1.6 + state.score * 0.08;
        scene.appendChild(d);
        state.drops.push(d);
      }

      function moveCatcher(x){
        state.catcherX = Math.max(40, Math.min(scene.clientWidth - 40, x));
        catcher.style.left = state.catcherX + 'px';
      }

      scene.addEventListener('pointermove', function(e){
        var rect = scene.getBoundingClientRect();
        moveCatcher(e.clientX - rect.left);
      });

      scene.addEventListener('pointerdown', function(e){
        var rect = scene.getBoundingClientRect();
        moveCatcher(e.clientX - rect.left);
      });

      function animate(ts){
        if(!state.running) return;
        if(!state.lastTime) state.lastTime = ts;
        var dt = (ts - state.lastTime) / 1000;
        state.lastTime = ts;

        if(Math.random() < 0.03 + state.score * 0.003){ spawnDrop(); }
        for (var i = state.drops.length - 1; i >= 0; i--){
          var d = state.drops[i];
          var top = parseFloat(d.style.top || 0) + dt * 220 * Number(d.dataset.speed);
          d.style.top = top + 'px';
          var left = parseFloat(d.style.left || 0);
          var catchY = scene.clientHeight - 38;
          if(top > catchY && top < catchY + 26 && Math.abs(left - state.catcherX) < 42){
            state.score += 1;
            d.remove();
            state.drops.splice(i, 1);
            updateInfo();
          } else if(top > scene.clientHeight + 40){
            d.remove();
            state.drops.splice(i, 1);
            state.lives -= 1;
            updateInfo();
            if(state.lives <= 0){
              state.running = false;
              info.textContent = 'Partie terminée ! Ton score : ' + state.score + ' 🍰';
              btn.style.display = 'inline-block';
              return;
            }
          }
        }

        state.raf = requestAnimationFrame(animate);
      }

      function start(){
        state.running = true;
        state.score = 0;
        state.lives = 3;
        state.lastTime = 0;
        state.drops.forEach(function(d){d.remove();});
        state.drops = [];
        btn.style.display = 'none';
        updateInfo();
        moveCatcher(scene.clientWidth / 2);
        state.raf = requestAnimationFrame(animate);
      }

      btn.addEventListener('click', start);
      updateInfo();
      moveCatcher(scene.clientWidth / 2);
      btn.style.display = 'inline-block';
    },
    stop: function(){
      if(this._raf) cancelAnimationFrame(this._raf);
    }
  };

  games.puzzle = {
    init: function(container){
      var info = E('div','info');
      var grid = E('div','puzzle-grid');
      var btn = E('button','action','Photo aléatoire');
      container.appendChild(info);
      container.appendChild(grid);
      container.appendChild(btn);

      var pieces = [];
      var empty = 8;
      var baseImage = IMG[0];

      function setBase(src){
        baseImage = src;
        pieces = Array.from({length:9}, function(_, i){ return i; });
        empty = 8;
        shufflePuzzle();
      }

      function shufflePuzzle(){
        var arr = [0,1,2,3,4,5,6,7,8];
        var e = 8;
        for(var k=0;k<60;k++){
          var neighbors = [];
          var row = Math.floor(e/3), col = e%3;
          if(row>0) neighbors.push(e-3);
          if(row<2) neighbors.push(e+3);
          if(col>0) neighbors.push(e-1);
          if(col<2) neighbors.push(e+1);
          var s = neighbors[Math.floor(Math.random()*neighbors.length)];
          arr[e] = arr[s]; arr[s] = 8; e = s;
        }
        pieces = arr;
        empty = e;
        render();
      }

      function render(){
        grid.innerHTML = '';
        pieces.forEach(function(v, i){
          var piece = E('button','puzzle-piece');
          if(v === 8){
            piece.classList.add('empty');
            piece.disabled = true;
          } else {
            var row = Math.floor(v / 3);
            var col = v % 3;
            piece.style.backgroundImage = 'url("'+baseImage+'")';
            piece.style.backgroundSize = '300% 300%';
            piece.style.backgroundPosition = (col * 50) + '% ' + (row * 50) + '%';
            piece.addEventListener('click', function(){
              var currentIndex = pieces.indexOf(v);
              if(!isNeighbor(currentIndex, empty)) return;
              pieces[currentIndex] = 8;
              pieces[empty] = v;
              empty = currentIndex;
              render();
              if(isSolved()){
                info.textContent = 'Puzzle terminé ! ☕';
              } else {
                info.textContent = 'Arrange les morceaux';
              }
            });
          }
          grid.appendChild(piece);
        });
        if(isSolved()) info.textContent = 'Puzzle terminé ! ☕';
      }

      function isNeighbor(a, b){
        var ar = Math.floor(a/3), ac = a%3, br = Math.floor(b/3), bc = b%3;
        return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
      }

      function isSolved(){
        for(var i=0;i<pieces.length;i++) if(pieces[i] !== i) return false;
        return true;
      }

      btn.addEventListener('click', function(){
        setBase(IMG[Math.floor(Math.random()*IMG.length)]);
        info.textContent = 'Nouveau puzzle';
      });

      setBase(IMG[0]);
      info.textContent = 'Arrange les morceaux';
    },
    stop: function(){}
  };

  games.tictac = {
    init: function(container){
      var info = E('div','info');
      var grid = E('div','ttt-grid');
      var row = E('div','row');
      var mode = E('button','action','2 joueurs');
      var reset = E('button','action','Rejouer');
      row.appendChild(mode); row.appendChild(reset);
      container.appendChild(info); container.appendChild(grid); container.appendChild(row);

      var cells = [];
      var board = Array(9).fill('');
      var turn = 'X';
      var playingAgainstAi = false;

      function draw(){
        cells.forEach(function(cell, idx){
          cell.innerHTML = '';
          if(board[idx]){
            var img = new Image();
            img.src = board[idx] === 'X' ? 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=200&q=80' : 'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=200&q=80';
            img.alt = board[idx] === 'X' ? 'café' : 'dessert';
            img.style.width = '72%';
            img.style.height = '72%';
            img.style.objectFit = 'cover';
            img.style.borderRadius = '12px';
            cell.appendChild(img);
          }
        });
      }

      function winnerLine(mark){
        var lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return lines.some(function(line){
          return line.every(function(i){ return board[i] === mark; });
        });
      }

      function checkEnd(){
        if(winnerLine('X')){ info.textContent = 'Café gagne ! ☕'; return true; }
        if(winnerLine('O')){ info.textContent = 'Dessert gagne ! 🍰'; return true; }
        if(board.every(Boolean)){ info.textContent = 'Match nul !'; return true; }
        return false;
      }

      function aiTurn(){
        if(!playingAgainstAi || turn !== 'O') return;
        var choices = [];
        board.forEach(function(v, i){ if(!v) choices.push(i); });
        var move = choices[Math.floor(Math.random() * choices.length)];
        setTimeout(function(){
          if(board[move]) return;
          board[move] = 'O';
          turn = 'X';
          if(checkEnd()) return;
          info.textContent = 'Tour du café';
          draw();
        }, 350);
      }

      function play(idx){
        if(board[idx] || checkEnd()) return;
        board[idx] = turn;
        draw();
        if(checkEnd()) return;
        turn = turn === 'X' ? 'O' : 'X';
        info.textContent = turn === 'X' ? 'Tour du café' : 'Tour du dessert';
        if(playingAgainstAi && turn === 'O') aiTurn();
      }

      for(var i=0;i<9;i++){
        var cell = E('button','ttt-cell');
        (function(idx){
          cell.addEventListener('click', function(){ play(idx); });
        })(i);
        grid.appendChild(cell);
        cells.push(cell);
      }

      function resetBoard(){
        board = Array(9).fill('');
        turn = 'X';
        info.textContent = 'Tour du café';
        draw();
      }

      mode.addEventListener('click', function(){
        playingAgainstAi = !playingAgainstAi;
        mode.textContent = playingAgainstAi ? '1 joueur' : '2 joueurs';
        resetBoard();
      });

      reset.addEventListener('click', resetBoard);
      resetBoard();
    },
    stop: function(){}
  };

  games.snake = {
    init: function(container){
      var info = E('div','info');
      var board = E('div','snake-grid');
      var btn = E('button','action','Jouer');
      container.appendChild(info);
      container.appendChild(board);
      container.appendChild(btn);

      var size = 10;
      var snake = [{x:4,y:5},{x:3,y:5},{x:2,y:5}];
      var dir = {x:1,y:0};
      var nextDir = {x:1,y:0};
      var food = {x:7,y:5};
      var timer = null;
      var score = 0;
      var best = localStorage.getItem('cafe-snake-best') || 0;

      function buildGrid(){
        for(var i=0;i<size*size;i++){
          var cell = E('div','snake-cell');
          board.appendChild(cell);
        }
      }

      function render(){
        var cells = board.children;
        for(var i=0;i<cells.length;i++){
          cells[i].classList.remove('snake','food');
          var x = i % size;
          var y = Math.floor(i / size);
          if(x === food.x && y === food.y) cells[i].classList.add('food');
          for(var j=0;j<snake.length;j++){
            if(snake[j].x === x && snake[j].y === y){
              cells[i].classList.add('snake');
              break;
            }
          }
        }
        info.textContent = 'Score : ' + score + '   Best : ' + best;
      }

      function placeFood(){
        do{
          food = {x: Math.floor(Math.random()*size), y: Math.floor(Math.random()*size)};
        } while(snake.some(function(p){ return p.x === food.x && p.y === food.y; }));
      }

      function tick(){
        dir = nextDir;
        var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        if(head.x < 0 || head.x >= size || head.y < 0 || head.y >= size){
          end();
          return;
        }
        if(snake.some(function(p){ return p.x === head.x && p.y === head.y; })){
          end();
          return;
        }
        snake.unshift(head);
        if(head.x === food.x && head.y === food.y){
          score += 1;
          if(score > best){
            best = score;
            localStorage.setItem('cafe-snake-best', best);
          }
          placeFood();
        } else {
          snake.pop();
        }
        render();
        timer = setTimeout(tick, 150);
      }

      function end(){
        clearTimeout(timer);
        info.textContent = 'Perdu ! Score : ' + score + ' 🍓';
      }

      function start(){
        clearTimeout(timer);
        snake = [{x:4,y:5},{x:3,y:5},{x:2,y:5}];
        dir = {x:1,y:0};
        nextDir = {x:1,y:0};
        score = 0;
        placeFood();
        render();
        tick();
      }

      function setDirection(x, y){
        if((dir.x + x === 0 && dir.y + y === 0) || (nextDir.x + x === 0 && nextDir.y + y === 0)) return;
        nextDir = {x:x, y:y};
      }

      document.addEventListener('keydown', function(e){
        var map = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
        if(map[e.key]) setDirection(map[e.key][0], map[e.key][1]);
      });

      btn.addEventListener('click', start);
      buildGrid();
      render();
    },
    stop: function(){
      clearTimeout(this.timer);
    }
  };

  Object.keys(games).forEach(function(name){
    var btn = E('button', '', name === 'memoire' ? 'Mémoire' : name === 'attrape' ? 'Attrape' : name === 'puzzle' ? 'Puzzle' : name === 'tictac' ? 'TicTac' : 'Snake');
    btn.onclick = function(){ show(name); };
    games[name].button = btn;
    tabs.appendChild(btn);
  });

  show('memoire');
})();
</script>
</body>
</html>
